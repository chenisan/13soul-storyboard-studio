<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>分鏡設計台</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css">
<script type="importmap">{ "imports": { "three": "/static/vendor/three.module.js" } }</script>
</head>
<body>
<header class="top">
  <h1>分鏡設計台</h1>
  <select id="projectSel" title="專案"></select>
  <span id="queueInfo" class="queue"></span>
  <span class="grow"></span>
  <span id="saveState" class="muted"></span>
  <button id="menuBtn" class="ghost menu-btn" aria-label="選單" aria-expanded="false" data-icon="menu"></button>

  <!-- 漢堡選單：點項目、點外面或按 Esc 收起 -->
  <nav id="menuPanel" class="menu-pop" hidden>
    <button data-icon="plus" id="newProject">新專案</button>
    <button data-icon="settings" id="projectSettings">專案設定</button>
    <hr>
    <button data-icon="assets" id="assetToggle"><span class="lbl">角色卡／場景</span></button>
    <button data-icon="samples" id="sampleBtn" title="同一個角色用不同鏡頭組合生成的對照圖">範例對照表</button>
    <hr>
    <button data-icon="download" id="exportMd">匯出分鏡表</button>
    <button data-icon="copy" id="exportList">複製分鏡清單</button>
  </nav>

  <!-- 角色卡與場景：右上角按鈕展開的面板，點外面或按 Esc 收起 -->
  <div id="assetPanel" class="asset-pop" hidden>
    <section>
      <div class="sec-head"><h2>角色卡</h2>
        <label class="btn small">上傳<input type="file" accept="image/*" multiple hidden data-upload="characters"></label>
        <button class="small ghost" data-import="characters">路徑匯入</button></div>
      <div class="drop" data-drop="characters">拖曳角色卡到這裡</div>
      <div id="charList" class="asset-list"></div>
    </section>
    <section>
      <div class="sec-head"><h2>場景</h2>
        <label class="btn small">上傳<input type="file" accept="image/*" multiple hidden data-upload="scenes"></label>
        <button class="small ghost" data-import="scenes">路徑匯入</button></div>
      <div class="drop" data-drop="scenes">拖曳場景圖到這裡</div>
      <div id="sceneList" class="asset-list"></div>
    </section>
  </div>
</header>

<div class="layout">
  <main id="editor" class="editor"></main>
</div>

<footer class="strip">
  <button type="button" class="sec-bar strip-bar" id="stripBar"></button>
  <div id="shotStrip" class="shots"></div>
  <div id="pairWarn" class="pair-warn"></div>
</footer>

<dialog id="dlg"><form method="dialog" id="dlgBody"></form></dialog>
<div id="toast" class="toast"></div>
<div id="sampleTip" class="sample-tip" hidden></div>
<script type="module" src="/static/app.js"></script>
</body>
</html>
